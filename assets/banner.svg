<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Animated Glow/Pulse Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
      
      /* Subtle Dynamic Animations in background */
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse-line {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-card1 { animation: float1 6s ease-in-out infinite; }
      .animated-card2 { animation: float2 8s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 20 10; animation: pulse-line 12s linear infinite; }
      .radar-hand { transform-origin: 950px 150px; animation: radar-sweep 10s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Tech Grid Overlay -->
  <g opacity="0.05">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in right/bg to never obstruct foreground text) -->
  
  <!-- Right Graphic: Connected Mesh / Radar Concept -->
  <g opacity="0.25">
    <circle cx="950" cy="150" r="100" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <circle cx="950" cy="150" r="60" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="950" cy="150" r="20" stroke="#c084fc" stroke-width="1.5" fill="none"/>
    <line x1="950" y1="150" x2="1050" y2="150" stroke="#38bdf8" stroke-width="2" class="radar-hand"/>
  </g>

  <!-- Dynamic Animated Floating HUD Cards in Background -->
  <g class="animated-card1" opacity="0.35">
    <rect x="720" y="45" width="160" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="735" y="70" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">⚡ CONNECTED WORKER</text>
    <text x="735" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Nodes: 99.8%</text>
    <circle cx="855" cy="65" r="4" fill="#34d399"/>
  </g>

  <g class="animated-card2" opacity="0.35">
    <rect x="880" y="175" width="170" height="75" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="895" y="200" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold">🛠️ DIGITAL WORK INSTRUCTIONS</text>
    <text x="895" y="220" fill="#94a3b8" font-family="sans-serif" font-size="10">SOP Sync: Real-time</text>
    <circle cx="1025" cy="195" r="4" fill="#38bdf8"/>
  </g>

  <!-- Dynamic Connecting Data Line -->
  <path d="M 650 210 Q 750 120 950 150 T 1150 80" stroke="url(#accent-grad)" stroke-width="2.5" fill="none" class="animated-line" opacity="0.5"/>

  <!-- Glowing Accent Bar Left -->
  <rect x="50" y="65" width="6" height="170" rx="3" fill="url(#accent-grad)" filter="url(#glow)"/>

  <!-- FOREGROUND CONTENT (Guaranteed Clean & Readable) -->
  <g transform="translate(75, 0)">
    <!-- Category Pill -->
    <rect x="0" y="58" width="270" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="75" class="tag">INDUSTRIAL FRONTLINE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Industrial Connected Frontline</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Curated SaaS Platforms, Connected Worker Tools & Open-Source Projects</text>

    <!-- Tech Badges inside Banner -->
    <g transform="translate(0, 202)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">🏭 Industry 4.0 / 5.0</text>

      <!-- Badge 2 -->
      <rect x="140" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="152" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">📋 SOPs & Workflows</text>

      <!-- Badge 3 -->
      <rect x="280" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="292" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">🔧 Maintenance & CMMS</text>
    </g>
  </g>
</svg>
