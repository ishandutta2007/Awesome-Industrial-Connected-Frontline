<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Accent Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .hud-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #94a3b8; }

      /* Dynamic Animations */
      @keyframes float1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse-line {
        0% { stroke-dashoffset: 200; opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-card1 { animation: float1 5s ease-in-out infinite; }
      .animated-card2 { animation: float2 7s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 12 8; animation: pulse-line 8s linear infinite; }
      .radar-hand { transform-origin: 950px 150px; animation: radar-sweep 10s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Tech Grid Overlay -->
  <g opacity="0.05">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS -->
  <!-- Radar Concept -->
  <g opacity="0.25">
    <circle cx="950" cy="150" r="100" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <circle cx="950" cy="150" r="60" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="950" cy="150" r="20" stroke="#c084fc" stroke-width="1.5" fill="none"/>
    <line x1="950" y1="150" x2="1050" y2="150" stroke="#38bdf8" stroke-width="2" class="radar-hand"/>
  </g>

  <!-- Animated Floating HUD Cards -->
  <g class="animated-card1" opacity="0.45">
    <rect x="740" y="45" width="170" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="755" y="70" class="hud-title" fill="#38bdf8">CONNECTED WORKER</text>
    <text x="755" y="90" class="hud-sub">Active Nodes: 99.8%</text>
    <circle cx="890" cy="65" r="4" fill="#34d399"/>
  </g>

  <g class="animated-card2" opacity="0.45">
    <rect x="880" y="175" width="180" height="65" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="895" y="200" class="hud-title" fill="#818cf8">DIGITAL WORK INSTRUCTIONS</text>
    <text x="895" y="220" class="hud-sub">SOP Sync: Real-time</text>
    <circle cx="1040" cy="195" r="4" fill="#38bdf8"/>
  </g>

  <!-- Connecting Line -->
  <path d="M 650 210 Q 750 120 950 150 T 1150 80" stroke="url(#accent-grad)" stroke-width="2.5" fill="none" class="animated-line" opacity="0.5"/>

  <!-- Left Accent Bar -->
  <rect x="50" y="65" width="6" height="170" rx="3" fill="url(#accent-grad)" filter="url(#glow)"/>

  <!-- FOREGROUND CONTENT -->
  <g transform="translate(75, 0)">
    <!-- Category Tag -->
    <rect x="0" y="58" width="260" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="75" class="tag">INDUSTRIAL FRONTLINE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Industrial Connected Frontline</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Curated SaaS Platforms, Connected Worker Tools &amp; Open-Source Projects</text>

    <!-- Badges -->
    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="17" class="badge-text">Industry 4.0 / 5.0</text>

      <rect x="160" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="172" y="17" class="badge-text">SOPs &amp; Workflows</text>

      <rect x="320" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="332" y="17" class="badge-text">Maintenance &amp; CMMS</text>
    </g>
  </g>
</svg>
